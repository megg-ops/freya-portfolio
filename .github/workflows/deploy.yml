name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；排队中的旧任务取消，不打断已在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # build 已包含 typecheck 与 dist/404.html 生成。
      # 默认按 GitHub Pages 子路径 /freya-portfolio/ 构建；绑定自定义域后
      # 把仓库变量 BASE_PATH 设为 / 即可切回根路径。
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/freya-portfolio/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
